name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  foundation:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.19.0
          cache: npm

      - name: Install exact dependencies without scripts
        run: npm ci --ignore-scripts

      - name: Check offline foundation
        run: npm run check:toolchain && npm run check:runtime-js && npm run typecheck:settings-fixture && npm run typecheck && npm run typecheck:development && npm run check:settings-runtime && npm run check:main-runtime && npm run check:build-proof && npm run typecheck:audio-tools
        env:
          npm_config_offline: "true"
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          NO_PROXY: ""

  verify:
    needs: foundation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Fetch pinned published settings baseline
        run: git fetch --no-tags --depth=1 origin fb15f9675f9ea910e98363635155bc4ff9eb1d2f

      - name: Fetch pinned F00 transition baseline
        run: git fetch --no-tags --depth=1 origin ae9f8e50a22dae9d549f1e476d302549ecc03b4a

      - name: Prepare pinned published payload
        run: node scripts/extension-e2e/published-payload.mjs --prepare

      - name: Run tests
        run: npm test

      - name: Build extension
        run: npm run build

      - name: Check package
        id: package
        run: npm run check

      - name: Check audio quality
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        env:
          GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          node --input-type=module <<'NODE'
          import {runQualityRunSet} from './scripts/audio-quality-diagnostics.mjs';
          import {openOwnedRoot} from './scripts/owned-files.mjs';
          if(!/^\d+$/.test(process.env.GITHUB_RUN_ID??'')||!/^\d+$/.test(process.env.GITHUB_RUN_ATTEMPT??''))throw new Error('quality-ci-identity');
          const prefix=`f01ci-${process.env.GITHUB_RUN_ID}-${process.env.GITHUB_RUN_ATTEMPT}`;
          const result=await runQualityRunSet({files:await openOwnedRoot(process.cwd()),prefix});
          console.log(JSON.stringify({complete:result.complete,failures:result.failures,paths:result.paths,exits:result.records.map(({label,exitCode})=>({label,exitCode}))}));
          if(!result.complete)process.exitCode=1;
          NODE

      - name: Run installed-extension E2E
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        run: npm run test:e2e

      - name: Run installed-extension negative control
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        run: npm run test:e2e:negative

      - name: Run installed old-new-old transition
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        run: node scripts/check-installed-transition.mjs --run-id=B2positive

      - name: Run installed storage-loss control
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        run: node scripts/check-installed-transition.mjs --run-id=B2negative --control=storage-loss

      - name: Upload exact synthetic audio evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: f01-audio-quality-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            output/audio-quality/report-f01ci-${{ github.run_id }}-${{ github.run_attempt }}-u1.json
            output/audio-quality/report-f01ci-${{ github.run_id }}-${{ github.run_attempt }}-u1-diagnostic.json
            output/audio-quality/report-f01ci-${{ github.run_id }}-${{ github.run_attempt }}-t1.json
            output/audio-quality/report-f01ci-${{ github.run_id }}-${{ github.run_attempt }}-t1-diagnostic.json
            output/audio-quality/report-f01ci-${{ github.run_id }}-${{ github.run_attempt }}-u2.json
            output/audio-quality/report-f01ci-${{ github.run_id }}-${{ github.run_attempt }}-u2-diagnostic.json
            output/audio-quality/report-f01ci-${{ github.run_id }}-${{ github.run_attempt }}-t2.json
            output/audio-quality/report-f01ci-${{ github.run_id }}-${{ github.run_attempt }}-t2-diagnostic.json
            output/audio-quality/report-f01ci-${{ github.run_id }}-${{ github.run_attempt }}-u3.json
            output/audio-quality/report-f01ci-${{ github.run_id }}-${{ github.run_attempt }}-u3-diagnostic.json
            output/audio-quality/report-f01ci-${{ github.run_id }}-${{ github.run_attempt }}-t3.json
            output/audio-quality/report-f01ci-${{ github.run_id }}-${{ github.run_attempt }}-t3-diagnostic.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload E2E failure artifacts
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: installed-extension-e2e
          path: |
            output/playwright/installed-extension-*/
            !output/playwright/installed-profile-*/
          if-no-files-found: ignore
          retention-days: 7
