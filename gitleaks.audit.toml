title = "Cheese Knife local secret checks"

[extend]
useDefault = true

[[allowlists]]
description = "Generated dependencies, local reports/browser profiles and private task artifacts"
paths = ['''(^|[/\\])(node_modules|dist|dist-firefox|output|\.git|\.superpowers|\.playwright-cli)([/\\]|$)''']

[[allowlists]]
description = "AF02 protocol state terminology, not a credential"
targetRules = ["generic-api-key"]
regexes = ['''^invalid/exhausted$''']
