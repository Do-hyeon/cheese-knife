<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div id="capabilities" class="box" aria-live="polite"></div>
    <div class="box settings-state">
      <div id="settings-status" role="status" aria-live="polite"></div>
      <button id="settings-discard" type="button" hidden></button>
      <pre id="settings-retired-draft" hidden></pre>
      <button id="settings-reconnect" type="button" hidden></button>
    </div>
    <section id="media-entry" class="box" hidden>
      <button id="media-open" type="button" disabled></button>
      <p id="media-entry-guide" class="desc"></p>
    </section>
    <div id="media-target-status" class="box desc" role="status" aria-live="polite"></div>
    <section id="media-controls" class="box" aria-label="Media settings" hidden>
      <label for="media-scope" id="media-scope-label"></label>
      <select id="media-scope"><option value="global">Global</option><option value="current" disabled>Current channel</option></select>
      <div id="media-status" role="status" aria-live="polite"></div>
      <pre id="media-draft" hidden></pre>
      <button id="media-refresh" type="button"></button>
      <button id="media-discard" type="button" hidden></button>
      <button id="media-upgrade" type="button" data-audio-label="upgrade" hidden>저장 형식 전환</button>
      <nav class="f01-tabs" role="tablist" aria-label="Media settings">
        <button id="media-audio-tab" type="button" role="tab" data-media-panel="audio" data-audio-label="audio" aria-controls="media-audio-tab-panel" aria-selected="true">오디오</button>
        <button id="media-video-tab" type="button" role="tab" data-media-panel="video" data-audio-label="video" aria-controls="media-video-tab-panel" aria-selected="false" tabindex="-1">영상</button>
        <button id="media-presets-tab" type="button" role="tab" data-media-panel="presets" data-audio-label="manage" aria-controls="media-presets" aria-selected="false" tabindex="-1">프리셋 관리</button>
      </nav>
      <section id="media-audio-tab-panel" role="tabpanel" aria-labelledby="media-audio-tab">
      <div id="media-audio-panel"></div>
      <div class="media-actions"><button id="media-audio-enable" type="button"></button><button id="media-audio-global" type="button"></button></div>
      <div class="media-actions" id="media-audio-preset-row"><label for="media-audio-preset" data-audio-label="audio_presets">오디오 프리셋</label><select id="media-audio-preset"></select><button id="media-audio-preset-apply" type="button" data-audio-label="apply">적용</button><button id="media-audio-save-preset" type="button" data-audio-label="save_preset">프리셋으로 저장</button></div>
      <div class="media-actions"><button id="media-legacy-read" type="button" data-audio-label="legacy_read" aria-describedby="media-legacy-status">사이트 Gain 읽기</button><button id="media-legacy-import" type="button" data-audio-label="legacy_import" aria-describedby="media-legacy-status" disabled>전역 Gain으로 가져오기</button><span id="media-legacy-status" role="status"></span></div>
      </section>
      <section id="media-video-tab-panel" role="tabpanel" aria-labelledby="media-video-tab" hidden>
      <div class="media-actions"><button id="media-video-enable" type="button"></button><button id="media-video-global" type="button"></button></div>
      <div id="media-fields"></div>
      <div class="media-actions" id="media-video-preset-row"><label for="media-video-preset" data-audio-label="video_presets">영상 프리셋</label><select id="media-video-preset"></select><button id="media-video-preset-apply" type="button" data-audio-label="apply">적용</button><button id="media-video-save-preset" type="button" data-audio-label="save_preset">프리셋으로 저장</button></div>
      </section>
      <section id="media-presets" role="tabpanel" aria-labelledby="media-presets-tab" hidden>
      <h2 data-audio-label="manage">프리셋 관리</h2>
      <label for="media-preset" id="media-preset-label"></label><select id="media-preset"></select>
      <label for="media-preset-name" id="media-preset-name-label"></label><input id="media-preset-name" type="text" maxlength="96" />
      <div class="media-actions"><button id="media-preset-rename" type="button"></button><button id="media-preset-delete" type="button"></button></div>
      <details id="media-preset-new"><summary data-audio-label="create">새 프리셋 만들기</summary>
      <label for="media-preset-domain" id="media-preset-domain-label"></label><select id="media-preset-domain"><option value="audio">Audio</option><option value="video">Video</option></select>
      <label for="media-preset-create-name" data-audio-label="name">이름</label><input id="media-preset-create-name" type="text" maxlength="96" />
      <p id="media-create-status" role="status"></p>
      <button id="media-preset-create" type="button"></button>
      </details>
      <button id="media-channel-delete" type="button"></button>
      </section>
    </section>
    <div id="list"></div>
    <div class="box">
      <a href="/styles.html" aria-disabled="true">
        <span id="stylesConfig"></span>
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
          <path
            d="M320 0c-17.7 0-32 14.3-32 32s14.3 32 32 32h82.7L201.4 265.4c-12.5 12.5-12.5 32.8 0 45.3s32.8 12.5 45.3 0L448 109.3V192c0 17.7 14.3 32 32 32s32-14.3 32-32V32c0-17.7-14.3-32-32-32H320zM80 32C35.8 32 0 67.8 0 112V432c0 44.2 35.8 80 80 80H400c44.2 0 80-35.8 80-80V320c0-17.7-14.3-32-32-32s-32 14.3-32 32V432c0 8.8-7.2 16-16 16H80c-8.8 0-16-7.2-16-16V112c0-8.8 7.2-16 16-16H192c17.7 0 32-14.3 32-32s-14.3-32-32-32H80z"
          />
        </svg>
      </a>
    </div>
    <footer>
      <a id="footer-guide" href="https://github.com/Do-hyeon/cheese-knife/blob/main/README.md" target="_blank" rel="noopener noreferrer">Guide</a>
      · <a id="footer-support" href="https://github.com/Do-hyeon/cheese-knife/issues" target="_blank" rel="noopener noreferrer">Report issue</a>
      · <a id="footer-source" href="https://github.com/Do-hyeon/cheese-knife/tree/main" target="_blank" rel="noopener noreferrer">Source</a>
      · <a id="footer-original" href="https://github.com/jebibot/cheese-knife" target="_blank" rel="noopener noreferrer">Original project</a>
    </footer>
    <script src="media-profiles.js"></script>
    <script src="config.js"></script>
    <script src="style-schema.js"></script>
    <script src="settings-contract.js"></script>
    <script src="settings-client.js"></script>
    <script src="audio-settings-ui.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
